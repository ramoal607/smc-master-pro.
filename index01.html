<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>SMC MASTER PRO</title>
<link rel="manifest" href="manifest.json"><meta name="theme-color" content="#0A0E1A">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
<style>
:root{--bg:#0A0E1A;--c:#121829;--b:#222b45;--t:#e8ecf7;--m:#8a94b2;--g:#FFD700;--up:#00FF88;--dn:#FF3B3B}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font:14px Manrope,system-ui,sans-serif;padding:env(safe-area-inset-top) 0 calc(64px + env(safe-area-inset-bottom))}
header{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border-bottom:1px solid var(--b);position:sticky;top:0;background:var(--bg);z-index:5}
h1{font-size:17px;margin:0;font-weight:800;letter-spacing:.5px}h1 b{color:var(--g)}h2{font-size:15px;margin:16px 0 8px}
main{max-width:1100px;margin:auto;padding:0 12px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.card{background:var(--c);border:1px solid var(--b);border-radius:10px;padding:12px;cursor:pointer}.card.s{cursor:default}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}.m{color:var(--m);font-size:12px}.up{color:var(--up)}.dn{color:var(--dn)}.g{color:var(--g)}
.px{font-size:22px;font-weight:800;font-variant-numeric:tabular-nums}.tag{font-size:11px;padding:2px 7px;border-radius:5px;border:1px solid var(--b)}
.BUY{background:var(--up);color:#00170c}.SELL{background:var(--dn);color:#fff}.WAIT{background:#2a3350;color:var(--m)}.sig{font-weight:800;padding:3px 10px;border-radius:6px}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:#0d1222;border-top:1px solid var(--b);padding-bottom:env(safe-area-inset-bottom);z-index:9}
nav button{flex:1;background:0;border:0;color:var(--m);padding:11px 2px;font:600 11px Manrope}nav button.on{color:var(--g)}
input,select,button.b{background:#0d1222;color:var(--t);border:1px solid var(--b);border-radius:8px;padding:9px;font:inherit;width:100%;margin:3px 0 8px}
button.b{background:var(--g);color:#000;font-weight:800;cursor:pointer;width:auto;padding:9px 16px}
.err{border:1px dashed var(--dn);color:var(--dn);border-radius:10px;padding:14px;margin:12px 0}.bar{height:8px;background:#1b2340;border-radius:5px;overflow:hidden}.bar i{display:block;height:100%;background:var(--g)}
#ch{height:min(60vh,460px);border:1px solid var(--b);border-radius:10px}.pills{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}.pills button{background:var(--c);color:var(--m);border:1px solid var(--b);border-radius:20px;padding:6px 12px;font:600 12px Manrope}.pills .on{color:#000;background:var(--g)}
.hi{color:var(--dn)}.me{color:var(--g)}.lo{color:var(--up)}ul{padding-left:18px;margin:6px 0}svg{background:#0d1222;border-radius:8px;width:100%;max-width:320px}.ok{color:var(--up)}
@media(min-width:760px){nav{position:static;max-width:1100px;margin:auto;border:0;background:0}body{padding-bottom:20px}}
</style></head><body>
<header><h1>SMC <b>MASTER PRO</b></h1><div class="m" id="st">Connect API</div><button class="pills" style="all:unset;color:var(--g);cursor:pointer" id="lg">EN/SW</button></header>
<nav id="nav"></nav><main id="v"></main>
<script>
const $=s=>document.querySelector(s),P=[['EUR/USD','EUR/USD'],['GBP/USD','GBP/USD'],['USD/JPY','USD/JPY'],['GBP/JPY','GBP/JPY'],['AUD/USD','AUD/USD'],['USD/CAD','USD/CAD'],['USD/CHF','USD/CHF'],['NZD/USD','NZD/USD'],['EUR/GBP','EUR/GBP'],['XAU/USD','XAU/USD'],['BTC/USD','BTC/USD'],['NAS100','NDX'],['US30','DJI']];
const S=k=>{try{return JSON.parse(localStorage[k]||'null')}catch{return null}};let K=S('keys')||{},J=S('journal')||[],tab='dash',sw=false,D={},A={},CAL=null,calErr='',tf='1h',cur='EUR/USD',chart,ser,lines=[],cache={};
const dec=s=>/JPY|XAU|NAS|US30/.test(s)?2:/BTC/.test(s)?1:5,fmt=(s,p)=>p==null?'--':(+p).toFixed(dec(s));
const noKey=()=>`<div class="err">Connect API to see live data.<br><span class="m">Open Settings and paste your Twelve Data key. No fake prices are ever shown.</span></div>`;
const TABS=[['dash','Dashboard'],['sig','Signals'],['tech','Chart'],['news','News'],['acad','Academy'],['tool','Risk/Journal'],['set','Settings']];
$('#nav').innerHTML=TABS.map(t=>`<button data-t="${t[0]}">${t[1]}</button>`).join('');$('#nav').onclick=e=>{if(e.target.dataset.t){tab=e.target.dataset.t;go()}};$('#lg').onclick=()=>{sw=!sw;go()};
const sess=()=>{const h=new Date().getUTCHours(),r=[];if(h>=7&&h<16)r.push('London');if(h>=12&&h<21)r.push('New York');if(h>=0&&h<9)r.push('Tokyo');if(h>=21||h<6)r.push('Sydney');return r.join(' / ')||'Off hours'};
async function td(sym,iv,n=200){if(!K.td)throw Error('No Twelve Data key');const j=await(await fetch(`https://api.twelvedata.com/time_series?symbol=${encodeURIComponent(sym)}&interval=${iv}&outputsize=${n}&apikey=${K.td}`)).json();if(j.status==='error'||!j.values)throw Error(j.message||'API error');return j.values.reverse().map(v=>({time:Math.floor(Date.parse(v.datetime.length<11?v.datetime+'T00:00:00Z':v.datetime.replace(' ','T')+'Z')/1e3),open:+v.open,high:+v.high,low:+v.low,close:+v.close}))}
/* ---------- SMC engine on real candles ---------- */
function analyze(c){const n=c.length,sh=[],sl=[];for(let i=3;i<n-3;i++){let H=1,L=1;for(let k=1;k<=3;k++){if(c[i].high<=c[i-k].high||c[i].high<=c[i+k].high)H=0;if(c[i].low>=c[i-k].low||c[i].low>=c[i+k].low)L=0}if(H)sh.push({i,p:c[i].high});if(L)sl.push({i,p:c[i].low})}
const last=(a,j)=>{for(let x=a.length-1;x>=0;x--)if(a[x].i<=j-4)return a[x]};let dir=0,ev=null;
for(let j=5;j<n;j++){const h=last(sh,j),l=last(sl,j);if(h&&c[j].close>h.p&&c[j-1].close<=h.p){ev={dir:1,j,type:dir===-1?'CHoCH':'BOS',lvl:h.p};dir=1}else if(l&&c[j].close<l.p&&c[j-1].close>=l.p){ev={dir:-1,j,type:dir===1?'CHoCH':'BOS',lvl:l.p};dir=-1}}
const px=c[n-1].close,atr=c.slice(-14).reduce((a,x)=>a+x.high-x.low,0)/14,R={dir,ev,sh:sh.slice(-3),sl:sl.slice(-3),atr,px,conf:[],sweep:0};
for(let j=n-10;j<n;j++){const h=last(sh,j),l=last(sl,j);if(h&&c[j].high>h.p&&c[j].close<h.p)R.sweep=-1,R.sw=h.p;if(l&&c[j].low<l.p&&c[j].close>l.p)R.sweep=1,R.sw=l.p}
if(ev){for(let k=ev.j;k>=Math.max(0,ev.j-25);k--){if(ev.dir===1?c[k].close<c[k].open:c[k].close>c[k].open){R.ob={hi:c[k].high,lo:c[k].low,dir:ev.dir};break}}}
for(let i=n-1;i>=Math.max(2,n-60);i--){const b=c[i-2].high<c[i].low,s=c[i-2].low>c[i].high;if(b||s){const f=b?{lo:c[i-2].high,hi:c[i].low,dir:1}:{lo:c[i].high,hi:c[i-2].low,dir:-1};if(!c.slice(i+1).some(x=>f.dir===1?x.low<f.lo:x.high>f.hi)&&(!R.fvg||f.dir===dir)){R.fvg=f;if(f.dir===dir)break}}}
const H=Math.max(...c.slice(-60).map(x=>x.high)),Lw=Math.min(...c.slice(-60).map(x=>x.low));R.rng=[Lw,H];R.zone=px>(H+Lw)/2?'Premium':'Discount';
const d=dir,C=[];if(d){C.push(`${ev.type} ${d>0?'bullish':'bearish'} structure`);if(R.sweep===d)C.push('Liquidity sweep in trade direction');if(R.ob&&R.ob.dir===d&&px<=R.ob.hi+atr*.3&&px>=R.ob.lo-atr*.3)C.push('Price mitigating the order block');else if(R.ob&&R.ob.dir===d)C.push('Valid order block');if(R.fvg&&R.fvg.dir===d)C.push('Unfilled fair value gap');if((d>0&&R.zone==='Discount')||(d<0&&R.zone==='Premium'))C.push(d>0?'Price in discount':'Price in premium')}
R.conf=C;R.sig='WAIT';if(d&&C.length>=3&&R.ob&&R.ob.dir===d){const e=(R.ob.hi+R.ob.lo)/2,sl2=d>0?R.ob.lo-atr*.2:R.ob.hi+atr*.2,r=Math.abs(e-sl2);R.sig=d>0?'BUY':'SELL';R.e=e;R.sl=sl2;R.t1=e+d*r*2;R.t2=e+d*r*3.5;R.rr='1:2 / 1:3.5';R.score=Math.min(95,40+C.length*10)}return R}
let qi=0;async function scan(){if(!K.td)return;const[nm,sym]=P[qi++%P.length];try{const c=await td(sym,'1h',200);cache[nm+'1h']=c;A[nm]=analyze(c);A[nm].ch=(c[c.length-1].close/c[Math.max(0,c.length-24)].close-1)*100;A[nm].spark=c.slice(-40).map(x=>x.close);D[nm]=D[nm]||{};if(D[nm].p==null)D[nm].p=c[c.length-1].close;$('#st').textContent='Live';$('#st').className='m up';if(['dash','sig'].includes(tab))go(1)}catch(e){$('#st').textContent=e.message.slice(0,40);$('#st').className='m dn';D[nm]=D[nm]||{};D[nm].err=e.message}}
function ws(){if(!K.td)return;const w=new WebSocket('wss://ws.twelvedata.com/v1/quotes/price?apikey='+K.td);w.onopen=()=>{w.send(JSON.stringify({action:'subscribe',params:{symbols:P.map(p=>p[1]).join(',')}}));w._h=setInterval(()=>w.send('{"action":"heartbeat"}'),10000)};
w.onmessage=m=>{const d=JSON.parse(m.data);if(d.event==='price'){const p=P.find(x=>x[1]===d.symbol);if(!p)return;D[p[0]]=D[p[0]]||{};D[p[0]].p=+d.price;D[p[0]].t=Date.now();if(ser&&tab==='tech'&&p[0]===cur&&cache[cur+tf]){const c=cache[cur+tf],l=c[c.length-1];l.close=+d.price;l.high=Math.max(l.high,l.close);l.low=Math.min(l.low,l.close);ser.update(l)}}};w.onclose=()=>{clearInterval(w._h);setTimeout(ws,5000)}}
/* ---------- views ---------- */
const spark=a=>{if(!a)return'';const mn=Math.min(...a),mx=Math.max(...a);return`<svg viewBox="0 0 100 24" style="height:24px;max-width:100%;background:0"><polyline fill="none" stroke="${a[a.length-1]>=a[0]?'#00FF88':'#FF3B3B'}" stroke-width="1.5" points="${a.map((v,i)=>`${i*100/(a.length-1)},${22-(v-mn)/(mx-mn||1)*20}`).join(' ')}"/></svg>`};
const biasT=a=>a?(a.dir>0?'Bullish':a.dir<0?'Bearish':'Neutral'):'--';
function card(r){const[n]=r,d=D[n]||{},a=A[n];return`<div class="card" onclick="cur='${n}';tab='tech';go()"><div class="row"><b>${n}</b><span class="tag">${sess()}</span></div><div class="row"><span class="px ${a&&a.ch>=0?'up':'dn'}">${fmt(n,d.p)}</span><span class="${a&&a.ch>=0?'up':'dn'}">${a?a.ch.toFixed(2)+'%':'--'}</span></div>${spark(a&&a.spark)}<div class="row m"><span>Spread: n/a (not in feed)</span><span>Bias: ${biasT(a)}</span></div>${d.err?`<div class="dn m">${d.err}</div>`:''}</div>`}
function sigCard(n){const a=A[n];return`<div class="card s"><div class="row"><b>${n} <span class="m">H1</span></b><span class="sig ${a.sig}">${a.sig}</span></div>${a.sig==='WAIT'?`<div class="m">Fewer than 3 confluences (${a.conf.length}). ${a.conf.join(', ')||'No clear structure.'}</div>`:`<div class="m">Entry ${fmt(n,a.e)} · SL ${fmt(n,a.sl)}<br>TP1 ${fmt(n,a.t1)} · TP2 ${fmt(n,a.t2)} · R:R ${a.rr}</div><div class="bar" style="margin:6px 0"><i style="width:${a.score}%"></i></div><div class="m">Confidence ${a.score}%</div><ul>${a.conf.map(x=>`<li>${x}</li>`).join('')}</ul>`}</div>`}
const views={
dash(){if(!K.td)return noKey();const top=Object.keys(A).filter(n=>A[n].sig!=='WAIT').sort((x,y)=>A[y].score-A[x].score).slice(0,3);return`<h2>Top 3 setups today</h2>${top.length?`<div class="grid">${top.map(sigCard).join('')}</div>`:`<div class="m">${Object.keys(A).length<P.length?`Scanning pairs ${Object.keys(A).length}/${P.length} (free plan: 1 pair per 8s)...`:'No 3-confluence setup right now. Waiting is a position.'}</div>`}<h2>Live market</h2><div class="grid">${P.map(card).join('')}</div>`},
sig(){if(!K.td)return noKey();const k=Object.keys(A);return`<h2>SMC signals (H1, real candles)</h2><div class="grid">${k.map(sigCard).join('')||'<div class="m">Scanning...</div>'}</div>`},
tech(){if(!K.td)return noKey();const a=A[cur];return`<select id="ps">${P.map(p=>`<option ${p[0]===cur?'selected':''}>${p[0]}</option>`).join('')}</select><div class="pills" id="tfs">${['5min','15min','1h','4h','1day'].map(t=>`<button data-f="${t}" class="${t===tf?'on':''}">${{'5min':'M5','15min':'M15','1h':'H1','4h':'H4','1day':'D1'}[t]}</button>`).join('')}</div><div id="ch"></div><div id="tx" class="card s" style="margin-top:10px"></div>`},
async news(){return`<h2>Today's economic calendar (EAT, GMT+3)</h2>${calErr?`<div class="err">${calErr}</div>`:''}<div id="cal">${CAL?'':'<div class="m">Loading...</div>'}</div>`},
acad(){return ACAD.map((m,i)=>`<div class="card s" style="margin-bottom:10px"><b class="g">Module ${i+1}: ${m[0][+sw]}</b><p>${m[1][+sw]}</p><svg viewBox="0 0 160 60"><polyline fill="none" stroke="#FFD700" stroke-width="2" points="${m[2]}"/></svg><ul>${m[3].map(x=>`<li>${x[+sw]}</li>`).join('')}</ul><b>Quiz:</b> ${m[4][0][+sw]}<div class="pills">${m[4][1].map((o,k)=>`<button onclick="this.className=${k}===${m[4][2]}?'on':'';this.textContent+=${k}===${m[4][2]}?' ✔':' ✘'">${o}</button>`).join('')}</div></div>`).join('')},
tool(){const w=J.filter(x=>x.pl>0).length,tot=J.reduce((a,x)=>a+x.pl,0);return`<h2>Risk calculator</h2><div class="card s"><div class="grid"><div>Balance $<input id="rb" type="number"></div><div>Risk %<input id="rr" type="number" value="1"></div><div>Entry<input id="re" type="number" step="any"></div><div>Stop loss<input id="rs" type="number" step="any"></div><div>Take profit<input id="rt" type="number" step="any"></div><div>Type<select id="rk"><option value="1">Forex (USD quote)</option><option value="2">Forex (USD base, e.g. USD/JPY)</option><option value="3">Gold (100 oz)</option><option value="4">Index / BTC (1 unit)</option></select></div></div><button class="b" onclick="calc()">Calculate</button><div id="ro" class="m"></div></div>
<h2>Trade journal</h2><div class="card s"><div class="grid"><div>Pair<input id="jp"></div><div>Side<select id="jd"><option>BUY</option><option>SELL</option></select></div><div>Result P/L $<input id="jl" type="number" step="any"></div></div><button class="b" onclick="addJ()">Save trade</button><p>Trades: ${J.length} · Win rate: <b class="g">${J.length?(w/J.length*100).toFixed(0):0}%</b> · Net P/L: <b class="${tot>=0?'up':'dn'}">$${tot.toFixed(2)}</b></p>${J.map((x,i)=>`<div class="row m"><span>${x.d} ${x.p} ${x.s}</span><span class="${x.pl>=0?'up':'dn'}">${x.pl}</span><a onclick="J.splice(${i},1);localStorage.journal=JSON.stringify(J);go()">✕</a></div>`).join('')}</div>`},
set(){return`<h2>API keys</h2><div class="card s">Twelve Data key<input id="k1" value="${K.td||''}" placeholder="paste key"><span class="m">Free plan: 8 requests/min, few websocket symbols. Indices (NDX, DJI) may need a paid plan.</span><br>Finnhub key (optional)<input id="k2" value="${K.fh||''}" placeholder="paste key"><button class="b" onclick="K={td:$('#k1').value.trim(),fh:$('#k2').value.trim()};localStorage.keys=JSON.stringify(K);location.reload()">Save and reload</button><p class="m">Keys stay in this browser only (localStorage).</p></div>`}};
function calc(){const b=+$('#rb').value,r=+$('#rr').value,e=+$('#re').value,s=+$('#rs').value,t=+$('#rt').value,k=$('#rk').value,dst=Math.abs(e-s);if(!b||!e||!s)return $('#ro').textContent='Enter balance, entry and stop loss.';const risk=b*r/100,L=k==1?risk/(dst*100000):k==2?risk/(dst*100000/e):k==3?risk/(dst*100):risk/dst;$('#ro').innerHTML=`Lot size: <b class="g">${L.toFixed(2)}</b> ${k==4?'units':'lots'}<br>Risk: $${risk.toFixed(2)}<br>Reward: ${t?'$'+(risk*Math.abs(t-e)/dst).toFixed(2)+' (R:R 1:'+(Math.abs(t-e)/dst).toFixed(2)+')':'--'}`}
function addJ(){const p=$('#jp').value,l=+$('#jl').value;if(!p)return;J.unshift({p,s:$('#jd').value,pl:l,d:new Date().toISOString().slice(0,10)});localStorage.journal=JSON.stringify(J);go()}
async function drawChart(){const el=$('#ch');if(!el)return;chart=LightweightCharts.createChart(el,{layout:{background:{color:'#0A0E1A'},textColor:'#8a94b2'},grid:{vertLines:{color:'#151c33'},horzLines:{color:'#151c33'}},timeScale:{timeVisible:true}});ser=chart.addCandlestickSeries({upColor:'#00FF88',downColor:'#FF3B3B',borderVisible:false,wickUpColor:'#00FF88',wickDownColor:'#FF3B3B'});
try{const sym=P.find(p=>p[0]===cur)[1],c=await td(sym,tf,300);cache[cur+tf]=c;ser.setData(c);const a=analyze(c);A[cur+'#'+tf]=a;const L=(p,col,t)=>ser.createPriceLine({price:p,color:col,lineWidth:1,lineStyle:2,title:t});if(a.ob){L(a.ob.hi,'#FFD700','OB hi');L(a.ob.lo,'#FFD700','OB lo')}if(a.fvg){L(a.fvg.hi,'#4da3ff','FVG');L(a.fvg.lo,'#4da3ff','FVG')}a.sh.forEach(x=>L(x.p,'#FF3B3B88','BSL'));a.sl.forEach(x=>L(x.p,'#00FF8888','SSL'));chart.timeScale().fitContent();
$('#tx').innerHTML=`<div class="row"><b>HTF bias: ${biasT(a)}</b><span class="m">${a.zone} zone</span></div><div class="bar" style="margin:6px 0"><i style="width:${Math.min(100,a.conf.length*25)}%"></i></div><div class="m">Confluence ${a.conf.length}/5. Last structure: ${a.ev?a.ev.type+' '+(a.ev.dir>0?'bullish':'bearish')+' at '+fmt(cur,a.ev.lvl):'none'}.<br>Resistance: ${a.sh.map(x=>fmt(cur,x.p)).join(', ')||'--'} · Support: ${a.sl.map(x=>fmt(cur,x.p)).join(', ')||'--'}<br>Sweep: ${a.sweep?(a.sweep>0?'sell-side swept at ':'buy-side swept at ')+fmt(cur,a.sw):'none recent'}. OB: ${a.ob?fmt(cur,a.ob.lo)+' - '+fmt(cur,a.ob.hi):'none'}. FVG: ${a.fvg?fmt(cur,a.fvg.lo)+' - '+fmt(cur,a.fvg.hi):'none'}.</div>`}catch(e){el.outerHTML=`<div class="err">${e.message}</div>`;$('#tx').remove()}
$('#ps').onchange=e=>{cur=e.target.value;go()};$('#tfs').onclick=e=>{if(e.target.dataset.f){tf=e.target.dataset.f;go()}}}
const CUR={US:'USD',EU:'EUR',GB:'GBP',JP:'JPY',AU:'AUD',CA:'CAD',CH:'CHF',NZ:'NZD',CN:'CNY',DE:'EUR'},eat=d=>d.toLocaleString('en-GB',{timeZone:'Africa/Dar_es_Salaam',hour:'2-digit',minute:'2-digit'}),eday=d=>d.toLocaleDateString('en-CA',{timeZone:'Africa/Dar_es_Salaam'});
async function loadCal(){let rows=null;if(K.fh){try{const t=eday(new Date()),j=await(await fetch(`https://finnhub.io/api/v1/calendar/economic?token=${K.fh}`)).json();if(!j.economicCalendar)throw Error(j.error||'Finnhub calendar unavailable');rows=j.economicCalendar.map(x=>({t:new Date(x.time.replace(' ','T')+'Z'),c:CUR[x.country]||x.country,e:x.event,i:x.impact,a:x.actual,f:x.estimate,p:x.prev}))}catch(e){calErr='Finnhub: '+e.message+' (economic calendar needs a Finnhub plan that includes it). Using Forex Factory feed.'}}
if(!rows)try{const j=await(await fetch('https://nfs.faireconomy.media/ff_calendar_thisweek.json')).json();rows=j.map(x=>({t:new Date(x.date),c:x.country,e:x.title,i:x.impact.toLowerCase(),a:null,f:x.forecast,p:x.previous}))}catch(e){calErr=(calErr?calErr+' ':'')+'Forex Factory feed failed: '+e.message}
CAL=(rows||[]).filter(x=>eday(x.t)===eday(new Date())&&x.i!=='holiday').sort((a,b)=>a.t-b.t);if(tab==='news')paintCal()}
